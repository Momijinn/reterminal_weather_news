name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    env:
      TZ: Asia/Tokyo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Webアプリケーションのビルド

      - name: Build site
        run: |
          touch .env
          echo "OWM_API_KEY=$OWM_API_KEY" >> .env
          echo "OWM_LAT=$OWM_LAT" >> .env
          echo "OWM_LON=$OWM_LON" >> .env

          npm run build
        env:
          NODE_ENV: production
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          OWM_LAT: ${{ vars.OWM_LAT }}
          OWM_LON: ${{ vars.OWM_LON }}

      - name: Remove Unnecessary File
        run: rm -f ./dist/mockServiceWorker.js

      # Playwrightを使ってスクリーンショットを撮る

      - name: Install Playwright browsers
        # Install Playwright browsers for screenshot
        run: npx playwright install chromium

      - name: Start Web App server in background
        run: npx serve -s ./dist -l 3000 &

      - name: Wait for server to start
        run: sleep 5

      - name: Take Screenshot using TypeScript
        run: |
          npm run screenshot
          mv screenshot.jpg ./dist/screenshot.jpg

      # ImageMagickをセットアップして画像変換を行う

      - name: Setup ImageMagick
        uses: mfinelli/setup-imagemagick@v7

      - name: Convert screenshot to bmp
        run: |
          magick xc:"#000000" xc:"#FFFFFF" xc:"#FF0000" xc:"#FFFF00" xc:"#0000FF" xc:"#00FF00" xc:"#FF8000" +append palette.png
          magick ./dist/screenshot.jpg \
            -colorspace sRGB \
            -white-threshold 85% \
            -black-threshold 15% \
            -level 15%,85%,0.5 \
            -sharpen 0x3 \
            -dither FloydSteinberg \
            -remap palette.png \
            -type truecolor \
            ./dist/screenshot.bmp

      # GitHub Pagesへデプロイするために成果物をアップロード

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
